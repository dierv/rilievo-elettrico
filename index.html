<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rilievo elettrico</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1d4ed8"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>
/* Strumento da cantiere: tema chiaro unico (leggibile al sole), accento blu tecnico, viola = AI */
:root{
  color-scheme: light;
  --bg:#eef0f3; --panel:#ffffff; --ink:#15181d; --mut:#5d6672; --line:#d6dae0;
  --acc:#1d4ed8; --acc2:#e8eefc; --ai:#7c3aed; --ai2:#f1eafe; --ok:#15803d; --ok2:#e7f6ec;
  --warn:#b45309; --warn2:#fdf3e2; --bad:#b91c1c; --bad2:#fdecec;
  --r:10px; --tb:56px;
  font-family: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-size:15px;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{white-space:nowrap;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;min-height:42px;touch-action:manipulation}
button:active{transform:translateY(1px)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.ai{background:var(--ai);border-color:var(--ai);color:#fff;font-weight:600}
button.okb{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
button.danger{color:var(--bad);border-color:#efc4c4}
button.ghost{border-color:transparent;background:transparent}
button.sm{min-height:34px;padding:5px 10px;font-size:13.5px}
button:disabled{opacity:.45;pointer-events:none}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;min-height:42px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.wrap{flex-wrap:wrap}
.hide{display:none!important}
.mut{color:var(--mut)}
.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;background:var(--acc2);color:var(--acc);font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.ai{background:var(--ai2);color:var(--ai)}
.chip.ok{background:var(--ok2);color:var(--ok)}
.chip.warn{background:var(--warn2);color:var(--warn)}
.chip.bad{background:var(--bad2);color:var(--bad)}
.chip.grey{background:#eceef1;color:var(--mut)}

/* HOME */
#home{max-width:980px;margin:0 auto;padding:22px 18px 60px}
#home h1{font-size:24px;margin:4px 0 2px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.scard{cursor:pointer;display:flex;flex-direction:column;gap:6px}
.scard h3{margin:0;font-size:17px}
.banner{padding:10px 12px;border-radius:8px;font-size:13.5px;margin-top:12px}
.banner.warn{background:var(--warn2);color:#7a4a08}
.banner.info{background:var(--acc2);color:#1e3a8a}

/* SURVEY */
#sv{position:fixed;inset:0;display:flex;flex-direction:column}
#topbar{height:var(--tb);background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 8px;flex:none}
#topbar .ttl{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26vw}
#planSel{width:auto;min-width:120px;max-width:24vw;min-height:38px;padding:6px 8px}
#syncB{font-size:12px}
.sp{flex:1}
#main{flex:1;display:flex;min-height:0;position:relative}
#tools{width:68px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:6px 5px;flex:none;overflow-y:auto}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:9px;border:1px solid transparent;font-size:10.5px;min-height:56px;color:var(--mut);background:transparent}
.tbtn svg{width:24px;height:24px}
.tbtn.on{background:var(--acc2);color:var(--acc);border-color:#c5d4fa;font-weight:700}
#cwrap{flex:1;position:relative;min-width:0;background:#e3e6ea;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(21,24,29,.86);color:#fff;padding:8px 14px;border-radius:99px;font-size:13.5px;pointer-events:none;max-width:92%;text-align:center}
#zoomBtns{position:absolute;right:10px;bottom:calc(var(--palH,0px) + 10px);display:flex;flex-direction:column;gap:6px}
#zoomBtns button{width:44px;height:44px;padding:0;font-size:20px;box-shadow:0 1px 4px rgba(0,0,0,.12)}#zRot.on{border-color:var(--acc);background:var(--acc2)}#zRotIco{transition:transform .15s}
#zCol{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1}#zCol span{font-size:9px;color:#64748b;margin-top:-1px}#zCol .trk{fill:#cbd5e1;transition:fill .15s}#zCol .knb{fill:#fff;stroke:#94a3b8;stroke-width:1;transition:transform .15s}#zCol.on{border-color:var(--acc);background:var(--acc2)}#zCol.on .trk{fill:url(#zColG)}#zCol.on .knb{transform:translateX(14px);stroke:#fff}
#rotPanel{position:absolute;right:62px;bottom:calc(var(--palH,0px) + 10px);width:min(300px,calc(100% - 80px));background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.16);padding:10px 12px;z-index:4;font-size:13px}#rotPanel input[type=range]{width:100%}
#aiQ{position:absolute;left:10px;bottom:10px}
#panel{width:360px;background:#fff;border-left:1px solid var(--line);overflow-y:auto;flex:none;padding:12px 14px 80px}
#panel h2{font-size:17px;margin:2px 0 8px;display:flex;align-items:center;gap:8px}
#panel .sec{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
#palette{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:6px 8px;display:flex;gap:6px;overflow-x:auto;align-items:center;z-index:3}
.pchip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;padding:4px 9px 4px 6px;min-height:50px;white-space:nowrap;background:#fff;font-size:13px;text-align:left}
.pchip img{width:30px;height:30px;flex:none}.pchip span{display:flex;flex-direction:column;line-height:1.2}.pchip span b{font-weight:600}.pchip span small{font-size:10px;color:var(--mut);font-weight:400}
.pchip.on{border-color:var(--acc);background:var(--acc2);font-weight:700}
.pcat{font-size:11px;color:var(--mut);font-weight:700;padding:0 2px 0 8px;white-space:nowrap}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer;background:#ddd}
.dlist{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.drow{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;cursor:pointer}
.drow img{width:20px;height:20px;flex:none}
.drow .g{flex:1;min-width:0}
.drow .g div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13.5px}
.kv b{font-weight:600}
table.t{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
table.t th{background:#f6f7f9;font-weight:600;position:sticky;top:0}
table.t td.n,table.t th.n{text-align:right}

/* MODAL */
#modal{position:fixed;inset:0;background:rgba(15,18,24,.48);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal .box{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:18px 18px 16px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#modal .box.wide{max-width:1000px}
#modal h3{margin:0 0 8px;font-size:19px}
#modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#15181d;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.err{background:var(--bad)}

/* PHOTO VIEWER */
#viewer{position:fixed;inset:0;background:#0d0f13;z-index:60;display:flex;flex-direction:column}
#viewer .vt{display:flex;gap:8px;align-items:center;padding:8px;color:#fff}
#viewer .vt button{background:#22262e;border-color:#343a45;color:#fff}
#vstage{flex:1;position:relative;overflow:hidden;touch-action:none}
#vinner{position:absolute;left:0;top:0;transform-origin:0 0}
#vinner img{display:block;user-select:none;-webkit-user-drag:none}
#vinner svg{position:absolute;left:0;top:0;width:100%;height:100%}
#vside{max-height:30vh;overflow:auto;background:#161a20;color:#e7e9ee;padding:8px 12px;font-size:13.5px}

@media (max-width:900px){
  #main{flex-direction:column}
  #tools{flex-direction:row;width:auto;height:64px;border-right:none;border-bottom:1px solid var(--line);overflow-x:auto}
  .tbtn{min-width:64px}
  #panel{width:auto;height:42vh;border-left:none;border-top:1px solid var(--line)}
  #topbar .ttl{max-width:30vw}
}
.palq{flex:none;width:170px;min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:14px}
.qtree{list-style:none;padding-left:4px;margin:6px 0}.qtree ul{list-style:none;padding-left:16px;margin:2px 0;border-left:2px solid var(--line)}
.qtree li{margin:3px 0;font-size:13px}.qtree .qd{cursor:pointer}.quadro table.t td,.quadro table.t th{font-size:12px}
.quadro tr[data-act]{cursor:pointer}
.sw{flex:none;width:34px;height:34px;min-height:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0;cursor:pointer;position:relative}
.sw.on{box-shadow:0 0 0 3px var(--acc)}
.swc{display:inline-block;background:conic-gradient(#ef4444,#f59e0b,#22c55e,#06b6d4,#3b82f6,#a855f7,#ef4444)}
.swc input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.pw{flex:none;width:40px;height:40px;min-height:0;padding:0;border:1px solid var(--line);border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center}
.pw span{display:block;width:24px;border-radius:9px}.pw.on{border-color:var(--acc);background:var(--acc2)}
.fam{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;padding:8px 10px 10px;margin:6px 0 4px;background:#f8fafc;border:1px solid var(--line);border-radius:10px}

.fates{display:flex;gap:4px;margin:6px 0 8px;flex-wrap:wrap}.fates button{flex:1;min-width:0;padding:6px 4px;font-size:12px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;color:#334155;min-height:34px}.fates button.on{background:#334155;border-color:#334155;color:#fff}
.rec{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:22px}
.recdot{width:16px;height:16px;border-radius:50%;background:#dc2626;animation:recb 1s infinite}
@keyframes recb{50%{opacity:.25}}

#palette.two{display:block;padding:6px 8px}
#palette.two .prow{display:flex;gap:6px;overflow-x:auto;align-items:center;position:relative;scrollbar-width:thin}
#palette.two .ptabs{padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid var(--line)}
#palette.two #palStrip{min-height:52px}
#palette.two .palq{width:240px}
.ptab{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 13px;border:1px solid var(--line);border-radius:20px;background:#fff;font:inherit;font-size:14px;font-weight:600;white-space:nowrap;color:inherit}
.ptab i{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.ptab.on{border-color:var(--acc);background:var(--acc2);color:var(--acc)}
.psep{flex:none;width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.pline{display:inline-flex;gap:6px;margin-left:auto;flex:none;padding-left:8px}
.pres{display:contents}
#palette.two .pcat{font-size:12px;padding:0 4px 0 9px;border-left:3px solid currentColor;align-self:stretch;display:flex;align-items:center;flex:none}
#palette.two .pchip{flex:none;white-space:normal;min-height:54px;padding:4px 8px 4px 6px}
#palette.two .pchip span{max-width:165px}
#palette.two .pchip span b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;line-height:1.15}
#updBar{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--acc);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px 12px;font-size:14px;max-width:calc(100vw - 24px)}#updBar span{flex:1}
</style></head><body>
<div id="home">
  <div class="row" style="align-items:flex-end">
    <div style="flex:3">
      <h1>Rilievo elettrico</h1>
      <div class="mut">Planimetria + foto → bozza dell'impianto esistente</div>
    </div>
    <div style="flex:none" class="row">
      <button id="hLib">Simboli</button>
      <button id="hSet">Impostazioni</button>
      <button id="hNew" class="pri">+ Nuovo sopralluogo</button>
    </div>
  </div>
  <div id="hBanner"></div>
  <div id="hList" class="hgrid"></div>
</div>

<div id="sv" class="hide">
  <div id="topbar">
    <button id="bBack" class="ghost" title="Sopralluoghi">&#8592;</button>
    <div class="ttl" id="svTitle"></div>
    <select id="planSel"></select>
    <button id="bAddPlan" class="sm">+ Tavola</button>
    <div class="sp"></div>
    <span id="syncB" class="chip grey">…</span>
    <button id="bUndo" class="sm" title="Annulla">&#8630; Annulla</button>
    <button id="bComputo" class="sm pri">Computo / Esporta</button>
    <button id="bMenu" class="sm">&#8942;</button>
  </div>
  <div id="main">
    <div id="tools"></div>
    <div id="cwrap">
      <canvas id="cv"></canvas>
      <div id="hint" class="hide"></div>

</div>

<div id="modal" class="hide"><div class="box"></div></div>
<div id="viewer" class="hide">
  <div class="vt">
    <button id="vClose">&#10005; Chiudi</button>
    <button id="vPrev">&#8249;</button><button id="vNext">&#8250;</button>
    <span id="vTitle" style="flex:1;font-size:14px"></span>
    <button id="vBoxes">Riquadri</button>
  </div>
  <div id="vstage"><div id="vinner"><img id="vimg" alt=""><svg id="vsvg" viewBox="0 0 1 1" preserveAspectRatio="none"></svg></div></div>

</div>
<div id="toast" class="hide"></div>

    });
  },
  get(s, k) { return this.tx(s, 'readonly', st => st.get(k)); },
  put(s, v) { return this.tx(s, 'readwrite', st => st.put(v)); },
  del(s, k) { return this.tx(s, 'readwrite', st => st.delete(k)); },

function dedupeRoom(r) {
  const k = ppm(planOf(r.planId)); const its = S.items.filter(i => i.planId === r.planId && (r.ext ? !roomById(i.roomId) : i.roomId === r.id) && !i.pts); let n = 0; const gone = new Set();
  pushUndo();
  for (let i = 0; i < its.length; i++) {
    const a = its[i]; if (gone.has(a.id)) continue;
    for (let j = i + 1; j < its.length; j++) {
      const b = its[j]; if (gone.has(b.id) || !triMatch(a, b) || a.hint || b.hint || (a.photoId && a.photoId === b.photoId)) continue;
      if (Math.hypot(a.x - b.x, a.y - b.y) < 0.45 * k) {
        const keepB = (b.ok && !a.ok) || (b.lk && !a.lk); const [kp, rm] = keepB ? [b, a] : [a, b];
        kp.n = Math.max(kp.n || 1, rm.n || 1); gone.add(rm.id); n++;
        if (kp.photoId && kp.d != null) kp.tri = (kp.tri || []).concat(rm.photoId && rm.d != null ? [{ p: rm.photoId, d: rm.d }] : [], rm.tri || []).filter(q => q.p !== kp.photoId);
        Sync.markItem(kp); Sync.markItem(rm); if (rm === a) break;
      }
    }
  }
  S.items = S.items.filter(i => !gone.has(i.id));
  return n;
}
function removeDrafts(ph) { S.items = S.items.filter(i => !(i.photoId === ph.id && !i.ok)); }
function deletePhoto(ph) {
  pushUndo();
  S.items.forEach(i => { if (i.photoId === ph.id && i.ok) { i.photoId = null; i.d = null; Sync.mark('plan:' + i.planId); } });
  S.items = S.items.filter(i => i.photoId !== ph.id);
  S.photos = S.photos.filter(p => p.id !== ph.id);
  Sync.del(pathFor('photo:' + ph.id)); IDB.del('blobs', 'photo_' + ph.id); Uploads.q.delete('photo_' + ph.id);
  Sync.mark('meta'); redraw();
}

function drawVnMark(x, cx, cy, r, n, sel) {

  if (sel) { x.beginPath(); x.arc(cx, cy, r + 7 * k, 0, 7); x.fillStyle = 'rgba(250,204,21,.45)'; x.fill(); }
  x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fillStyle = VN_COL; x.fill(); x.lineWidth = Math.max(1.5, 2 * k); x.strokeStyle = '#fff'; x.stroke();
  x.strokeStyle = '#fff'; x.fillStyle = '#fff'; x.lineWidth = 1.6 * k; x.lineCap = 'round';
  if (!n || n.mime) { // microfono
    x.beginPath(); if (x.roundRect) x.roundRect(cx - 2.6 * k, cy - 6.8 * k, 5.2 * k, 8.6 * k, 2.6 * k); else x.rect(cx - 2.6 * k, cy - 6.8 * k, 5.2 * k, 8.6 * k); x.fill();
    x.beginPath(); x.arc(cx, cy - 2 * k, 5 * k, 0.12 * Math.PI, 0.88 * Math.PI); x.stroke();
    x.beginPath(); x.moveTo(cx, cy + 3 * k); x.lineTo(cx, cy + 6.5 * k); x.stroke();
  } else for (const dy of [-4, 0, 4]) { x.beginPath(); x.moveTo(cx - 5 * k, cy + dy * k); x.lineTo(cx + 5 * k, cy + dy * k); x.stroke(); } // solo testo
  if (n) { const lb = vnLabel(n); x.font = `700 ${Math.round(12 * k)}px sans-serif`; x.textAlign = 'left'; x.textBaseline = 'alphabetic'; x.lineWidth = 3 * k; x.strokeStyle = '#fff'; x.strokeText(lb, cx + r + 3 * k, cy + 4 * k); x.fillStyle = VN_COL; x.fillText(lb, cx + r + 3 * k, cy + 4 * k); }
  x.restore();
}

${JSON.stringify(data).slice(0, 120000)}`;

  }
  for (const it of all.filter(i => i.hint)) { const [x, y] = T(it.x, it.y); circ('RIL_INDIZI', x, y, 0.15 * U); text('RIL_INDIZI', x + 0.2 * U, y - 0.05 * U, 0.1 * U, '! ' + (it.note || 'indizio').slice(0, 90)); }
  for (const n of S.vnotes.filter(n => n.planId === P.id)) { // note audio: cerchio, numero e testo
    const [x, y] = T(n.x, n.y); circ('RIL_NOTE_AUDIO', x, y, 0.12 * U); circ('RIL_NOTE_AUDIO', x, y, 0.06 * U);
    text('RIL_NOTE_AUDIO', x + 0.17 * U, y - 0.05 * U, 0.12 * U, vnLabel(n) + (n.mime ? ' nota audio' : ' nota'));
    if (n.text) text('RIL_NOTE_AUDIO', x + 0.17 * U, y - 0.23 * U, 0.08 * U, n.text.replace(/\s+/g, ' ').slice(0, 120));
  }
  for (const ph of S.photos.filter(p => p.planId === P.id && p.x != null)) {
    const [x, y] = T(ph.x, ph.y); circ('RIL_FOTO', x, y, 0.12 * U);
    const a = -ph.a; line('RIL_FOTO', [x, y], [x + Math.cos(a) * 0.5 * U, y + Math.sin(a) * 0.5 * U]);
    text('RIL_FOTO', x + 0.15 * U, y - 0.25 * U, 0.12 * U, pnum.get(ph.id) || '');
  }
  g(0, 'ENDSEC');
  // ---- OBJECTS ----
  g(0, 'SECTION'); g(2, 'OBJECTS');
  g(0, 'DICTIONARY'); g(5, 'C'); g(330, '0'); g(100, 'AcDbDictionary'); g(281, 1); g(3, 'ACAD_GROUP'); g(350, 'D'); g(3, 'ACAD_PLOTSTYLENAME'); g(350, 'E'); if (img) { g(3, 'ACAD_IMAGE_DICT'); g(350, IH.dict); g(3, 'ACAD_IMAGE_VARS'); g(350, IH.vars); }
  g(0, 'DICTIONARY'); g(5, 'D'); g(330, 'C'); g(100, 'AcDbDictionary'); g(281, 1);
  g(0, 'ACDBDICTIONARYWDFLT'); g(5, 'E'); g(330, 'C'); g(100, 'AcDbDictionary'); g(281, 1); g(3, 'Normal'); g(350, 'F'); g(100, 'AcDbDictionaryWithDefault'); g(340, 'F');
  g(0, 'ACDBPLACEHOLDER'); g(5, 'F'); g(330, 'E');
  if (img) {
    const px = 1 / ppm(P); const defName = safeName(P.name).toUpperCase() + '_SFONDO';
    g(0, 'DICTIONARY'); g(5, IH.dict); g(330, 'C'); g(100, 'AcDbDictionary'); g(281, 1); g(3, defName); g(350, IH.def);
    g(0, 'IMAGEDEF'); g(5, IH.def); g(102, '{ACAD_REACTORS'); g(330, IH.react); g(102, '}'); g(330, IH.dict); g(100, 'AcDbRasterImageDef'); g(90, 0); g(1, img.file); g(10, img.w); g(20, img.h); g(11, px); g(21, px); g(280, 1); g(281, 0);
    g(0, 'IMAGEDEF_REACTOR'); g(5, IH.react); g(330, IH.ent); g(100, 'AcDbRasterImageDefReactor'); g(90, 2); g(330, IH.ent);
    g(0, 'RASTERVARIABLES'); g(5, IH.vars); g(330, 'C'); g(100, 'AcDbRasterVariables'); g(90, 0); g(70, 1); g(71, 1); g(72, 0);
  }
  g(0, 'ENDSEC'); g(0, 'EOF');
  out[seedAt] = (hs + 16).toString(16).toUpperCase(); // $HANDSEED: oltre l'ultimo handle usato
  return out.join('\r\n') + '\r\n';
}

const blockNameOf = s => s.leg ? (s.block || s.code) : 'RIL_' + safeName(s.code).toUpperCase();
const ACI_TAB = [[1, 255, 0, 0], [2, 255, 255, 0], [3, 0, 255, 0], [4, 0, 255, 255], [5, 0, 0, 255], [6, 255, 0, 255], [7, 255, 255, 255], [8, 128, 128, 128], [9, 192, 192, 192], [30, 255, 127, 0], [40, 255, 191, 0], [90, 63, 255, 0], [140, 0, 191, 255], [150, 0, 127, 255], [160, 0, 63, 255], [170, 0, 0, 191], [174, 94, 103, 175], [178, 41, 49, 137]];
function aciOf(hex) { const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16); let best = 7, bd = Infinity; for (const [a, R, G, B] of ACI_TAB) { const d = (r - R) ** 2 + (g - G) ** 2 + (b - B) ** 2; if (d < bd) { bd = d; best = a; } } return best; }
function writeLegGeom(E, owner, L) { // geometria del blocco della legenda (metri, origine = punto di inserimento), dentro il blocco `owner`
  const convex = q => { let sg = 0; const n = q.length / 2; for (let i = 0; i < n; i++) { const ax = q[2 * i], ay = q[2 * i + 1], bx = q[(2 * i + 2) % q.length], by = q[(2 * i + 3) % q.length], cx = q[(2 * i + 4) % q.length], cy = q[(2 * i + 5) % q.length]; const c = (bx - ax) * (cy - by) - (by - ay) * (cx - bx); if (Math.abs(c) < 1e-12) continue; const s = Math.sign(c); if (sg && s !== sg) return false; sg = s; } return true; };
  const pairs = d => { const o = []; for (let i = 0; i < d.length; i += 2) o.push([d[i], d[i + 1]]); return o; };
  for (const p of L.g) {
    const c = aciOf(p.c), o = { owner, color: c };
    if (p.t === 'L') E.line('0', [p.d[0], p.d[1]], [p.d[2], p.d[3]], o);
    else if (p.t === 'P') E.lwp('0', pairs(p.d), !!p.z, o);
    else if (p.t === 'F') for (const q of p.d) {
      const n = q.length / 2; const P = i => [q[2 * i], q[2 * i + 1]];
      if (n === 3) E.solid('0', c, P(0), P(1), P(2), P(2), owner); else if (n === 4) E.solid('0', c, P(0), P(1), P(2), P(3), owner);
      else if (convex(q)) for (let i = 1; i < n - 1; i++) E.solid('0', c, P(0), P(i), P(i + 1), P(i + 1), owner);
      else E.lwp('0', pairs(q), true, o);
    }
    else if (p.t === 'T') E.text('0', p.x, p.y, p.h, p.s, false, { owner, color: c, rot: p.r || 0, wf: p.w, ha: p.ha || 0, va: p.va || 0 });
  }
}

/* ---- PNG annotato ---- */
async function annotatedPng(P, pnum) {
  const im = await loadPlanImage(P.id); const allIts = S.items.filter(i => i.planId === P.id); const its = allIts.filter(i => !i.hint);
  const LW = Math.round(Math.max(520, P.w * 0.22)); const c = newCanvas(P.w + LW, P.h); const x = c.getContext('2d'); x.drawImage(im.canvas, 0, 0);
  const k = ppm(P); const R = Math.max(10, 0.18 * k); const fs = Math.max(12, 0.22 * k);
  for (const r of S.rooms.filter(r => r.planId === P.id)) {
    x.beginPath(); r.poly.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath(); x.fillStyle = 'rgba(59,130,246,.06)'; x.fill(); x.strokeStyle = 'rgba(59,130,246,.6)'; x.lineWidth = Math.max(1.5, R / 6); x.stroke();
    const [cx, cy] = polyCentroid(r.poly); x.font = `600 ${fs}px sans-serif`; x.textAlign = 'center'; x.lineWidth = fs / 3; x.strokeStyle = '#fff'; x.strokeText(r.name, cx, cy + fs * 1.6); x.fillStyle = '#1e3a8a'; x.fillText(r.name, cx, cy + fs * 1.6);
  }
  for (const d of S.draws.filter(d => d.planId === P.id)) for (const st of d.strokes) strokePath(x, st.pts, p => p, Math.max(1, st.w), st.col);
  for (const it of its) if (it.pts) { const s = symOf(it.s); x.beginPath(); it.pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.strokeStyle = symColor(s); x.lineWidth = R / 2.5; x.setLineDash(it.ok ? [] : [R, R / 2]); x.stroke(); x.setLineDash([]); }
  const pp = its.filter(i => !i.pts).map(it => ({ id: it.id, x: it.x, y: it.y, it })); const dp = declutter(pp, R);
  for (const p of pp) { const [dx, dy] = dp.get(p.id); if (Math.hypot(dx - p.x, dy - p.y) < 1) continue; x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(dx, dy); x.strokeStyle = 'rgba(30,41,59,.6)'; x.lineWidth = Math.max(1, R / 10); x.stroke(); x.beginPath(); x.arc(p.x, p.y, R / 6, 0, 7); x.fillStyle = '#1e293b'; x.fill(); }
  for (const p of pp) { const it = p.it; const s = symOf(it.s); const [dx, dy] = dp.get(p.id); if (isPlate(it)) drawPlate(x, it, dx, dy, R, !it.ok, itemRot(it)); else drawSym(x, s, dx, dy, R, !it.ok, itemRot(it)); if (it.fate) drawFate(x, dx, dy, isPlate(it) ? R * 1.15 : R, it.fate, R / 8); x.font = `600 ${fs * .8}px sans-serif`; x.textAlign = 'left'; x.lineWidth = fs / 4; x.strokeStyle = '#fff'; const l = (isQuadroCode(it.s) ? quadroLabel(it) : symShort(s) + (it.tag ? ' ' + it.tag : '')) + (it.n > 1 ? '×' + it.n : ''); x.strokeText(l, dx + R * 1.1, dy - R * .4); x.fillStyle = symColor(s); x.fillText(l, dx + R * 1.1, dy - R * .4); }
  for (const it of allIts.filter(i => i.hint)) drawHint(x, it.x, it.y, R);
  const vns = S.vnotes.filter(n => n.planId === P.id); for (const n of vns) drawVnMark(x, n.x, n.y, R * 0.75, n, false);
  for (const ph of S.photos.filter(p => p.planId === P.id && p.x != null)) { x.beginPath(); x.arc(ph.x, ph.y, R * .6, 0, 7); x.fillStyle = '#fff'; x.fill(); x.strokeStyle = '#0891b2'; x.lineWidth = R / 5; x.stroke(); x.beginPath(); x.moveTo(ph.x, ph.y); x.lineTo(ph.x + Math.cos(ph.a) * R * 2, ph.y + Math.sin(ph.a) * R * 2); x.stroke(); x.font = `${fs * .75}px sans-serif`; x.fillStyle = '#0891b2'; x.textAlign = 'left'; x.fillText(pnum.get(ph.id) || '', ph.x + R * .8, ph.y + R * 1.4); }
  // legenda a destra
  const lx = P.w, pad = LW * 0.05, lf = Math.max(14, LW / 26), lh = lf * 1.9;
  x.fillStyle = '#fff'; x.fillRect(lx, 0, LW, P.h); x.strokeStyle = '#333'; x.lineWidth = 2; x.beginPath(); x.moveTo(lx, 0); x.lineTo(lx, P.h); x.stroke();
  x.textAlign = 'left'; x.fillStyle = '#111'; x.font = `700 ${lf * 1.2}px sans-serif`; x.fillText('RILIEVO IMPIANTO ESISTENTE', lx + pad, pad + lf * 1.2);
  x.font = `${lf}px sans-serif`; let yy = pad + lf * 3;
  for (const t of [S.sv.name, S.sv.client, S.sv.address, 'Tavola: ' + P.name, 'Data: ' + new Date().toLocaleDateString('it-IT')]) { if (t) { x.fillText(String(t).slice(0, 48), lx + pad, yy); yy += lf * 1.4; } }
  yy += lf; x.font = `700 ${lf}px sans-serif`; x.fillText('Legenda', lx + pad, yy); yy += lh;
  const m = totals(its);
  Object.keys(m).sort().forEach(key => {
    const code = kCode(key);
    if (yy > P.h - lh * 3) return; const s = symOf(code); drawSymFit(x, s, lx + pad + lf * .6, yy - lf * .35, lf * 1.3);
    x.font = `700 ${lf * .9}px sans-serif`; x.fillStyle = '#111'; x.fillText(symShort(s), lx + pad + lf * 1.6, yy);
    x.font = `${lf * .85}px sans-serif`; x.fillText(`${kName(key).slice(0, 40)} – ${itNum(m[key].q, umOf(code) === 'm' ? 1 : 0)} ${umOf(code)}`, lx + pad + lf * 4.6, yy); yy += lh;
  });
  yy += lf * .5; x.font = `${lf * .8}px sans-serif`; x.fillStyle = '#555';
  x.fillText('Simboli tratteggiati = bozze AI da verificare', lx + pad, yy); yy += lf * 1.3; x.fillText('F001… = punti di scatto delle foto', lx + pad, yy);
  if (allIts.some(i => i.hint)) { yy += lf * 1.3; x.fillText('⚠ = indizio da verificare (non conteggiato)', lx + pad, yy); }
  if (vns.length) { yy += lf * 1.3; x.fillText('N1… = note audio (file nella cartella audio)', lx + pad, yy); }
  return await canvasToBlob(c, 'image/png');
}

  sdk: null, app: null, auth: null, provider: null, user: null,
  ready: false, started: false, busy: null, error: '', unsubscribe: null,

  init() {
    if (this.started) return;
    this.started = true;
    try {
      const sdk = window.FB;
      if (!sdk) throw { code: 'sdk-unavailable' };
      this.sdk = sdk;
      this.app = sdk.getApps().find(app => app.name === 'sopralux') || sdk.initializeApp(FIREBASE_CONFIG, 'sopralux');
      this.auth = sdk.getAuth(this.app);
      this.auth.languageCode = 'it';

      this.provider.setCustomParameters({ prompt: 'select_account' });

      // l'app: l'utente può subito lavorare sui sopralluoghi locali.
      this.unsubscribe = sdk.onAuthStateChanged(this.auth, user => {
        this.user = user;
        this.ready = true;
        this.error = '';
        this.refresh();
      }, error => {
        this.ready = false;
        this.error = 'Accesso Google non disponibile. Riapri l’app per riprovare.';
        this.refresh();
      });
    } catch (error) {
      this.auth = null;
      this.ready = false;
      this.error = this.message(error);
    }
    window.addEventListener('online', () => this.refresh());
    window.addEventListener('offline', () => this.refresh());
    this.refresh();
  },

  message(error) {
    const code = error && error.code;
    const messages = {
      'sdk-unavailable': 'Accesso Google non disponibile. Riapri l’app quando hai una connessione.',
      'auth/popup-blocked': 'Il browser ha bloccato la finestra di accesso. Consenti i popup per questo sito e riprova. Se usi l’app installata, apri lo stesso indirizzo nel browser.',
      'auth/unauthorized-domain': 'Questo indirizzo non è ancora autorizzato: aggiungi ' + location.hostname + ' ai domini autorizzati di Firebase Authentication.',
      'auth/operation-not-allowed': 'L’accesso Google non è ancora abilitato nel progetto Firebase di Sopralux.',
      'auth/configuration-not-found': 'Authentication non è ancora configurato nel progetto Firebase di Sopralux.',
      'auth/network-request-failed': 'Connessione non riuscita. Controlla la rete e riprova.',
      'auth/invalid-api-key': 'Configurazione Firebase non valida: verifica la configurazione dell’app Sopralux.',
      'auth/app-not-authorized': 'Questa app non è autorizzata ad accedere al progetto Firebase.',
      'auth/user-disabled': 'Questo account è stato disabilitato.',
      'auth/too-many-requests': 'Troppi tentativi di accesso. Attendi qualche minuto e riprova.',
      'auth/web-storage-unsupported': 'Il browser non permette di memorizzare l’accesso. Abilita i dati dei siti e riprova.',
      'auth/operation-not-supported-in-this-environment': 'Apri Sopralux dal suo indirizzo HTTPS in Chrome, Edge o Safari e riprova.',
    };
    return messages[code] || 'Operazione sull’account non riuscita. Riapri l’app e riprova.';
  },

  async signIn() {
    if (this.busy || !this.auth || !this.ready) return;
    if (!navigator.onLine) {
      this.error = 'Per accedere con Google serve una connessione. Puoi continuare a usare i sopralluoghi locali.';
      this.refresh();
      return;
    }
    this.busy = 'signin'; this.error = '';
    this.refresh();
    try {
      // Chiamata diretta dal click: nessuna attesa prima dell'apertura del popup,
      // per conservare l'attivazione dell'utente anche su Safari e tablet.
      await this.sdk.signInWithPopup(this.auth, this.provider);
      toast('Accesso Google effettuato');
    } catch (error) {
      if (!['auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(error && error.code)) {
        this.error = this.message(error);
        toast(this.error, true, 8000);
      }
    } finally {
      this.busy = null;
      this.refresh();
    }
  },

  async signOut() {
    if (this.busy || !this.auth || !this.user) return;
    this.busy = 'signout'; this.error = '';
    this.refresh();
    try {
      await this.sdk.signOut(this.auth);
      toast('Uscita dall’account Google effettuata');
    } catch (error) {
      this.error = this.message(error);
      toast(this.error, true, 8000);
    } finally {
      this.busy = null;
      this.refresh();
    }
  },

  contentHtml() {
    const signed = !!this.user;
    const label = signed ? (this.user.email || this.user.displayName || 'Account Google collegato') : 'Account Google';
    const button = signed
      ? `<button class="sm" id="fbSignOut"${this.busy ? ' disabled' : ''}>${this.busy === 'signout' ? 'Uscita…' : 'Esci'}</button>`
      : this.auth
        ? `<button class="sm pri" id="fbSignIn"${!this.ready || this.busy ? ' disabled' : ''}>${this.busy === 'signin' ? 'Accesso…' : this.ready ? 'Accedi con Google' : this.error ? 'Accesso non disponibile' : 'Preparazione accesso…'}</button>`
        : '';
    return `<div class="row wrap" style="gap:10px"><div style="flex:1;min-width:160px;overflow-wrap:anywhere"><b>${esc(label)}</b>${signed && !navigator.onLine ? ' <span class="chip warn">Offline</span>' : ''}</div>${button}</div>
      <div class="small" style="margin-top:6px">${signed ? 'Accesso effettuato. ' : ''}I sopralluoghi restano su questo dispositivo. La sincronizzazione tra dispositivi non è ancora attiva.</div>
      ${this.error ? `<div class="small" role="status" style="margin-top:6px;color:var(--bad)">${esc(this.error)}</div>` : ''}`;
  },

  html() {
    return `<div class="banner" id="pwaAccount" role="region" aria-label="Account Google">${this.contentHtml()}</div>`;
  },

  wire() {
    const signIn = document.querySelector('#fbSignIn');
    const signOut = document.querySelector('#fbSignOut');
    if (signIn) signIn.onclick = () => this.signIn();
    if (signOut) signOut.onclick = () => this.signOut();
  },

  refresh() {
    const panel = document.querySelector('#pwaAccount');
    if (!panel) return;
    // Aggiorna soltanto l'account: il listener non riapre la home mentre si lavora.
    panel.innerHTML = this.contentHtml();
    this.wire();
  },
};

  const imgMime = b => b.type && /^image\//.test(b.type) ? b.type : 'image/jpeg';
  for (const P of S.sv.plans) await put('plan_' + P.id, P, 'plan', b => b.type && /^image\//.test(b.type) ? b.type : 'image/png');
  for (const p of S.photos) await put('photo_' + p.id, p, 'photo', imgMime);
  for (const v of S.vnotes) if (v.mime) await put('audio_' + v.id, v, 'audio', () => v.mime);
  const root = base() + '/' + S.sv.id; [...Sync.last.keys()].forEach(k => { if (k === root || k.startsWith(root + '/')) Sync.last.delete(k); }); // va riscritto tutto
  Sync.mark('meta', ...S.sv.plans.map(p => 'plan:' + p.id), ...S.photos.map(p => 'photo:' + p.id), ...Object.keys(S.closure).map(id => 'closure:' + id));
  S.surveys = [S.sv].concat(S.surveys.filter(x => x.id !== S.sv.id));
  await Sync.flush();
  showSurvey(); toast(`Sopralluogo importato${miss ? ` (${miss} file mancanti)` : ''}`, !!miss, 5000);
  return true;
}
function reidSnapshot(d, oldIds) { // copia: nuovi codici per sopralluogo, tavole, foto e note (i file locali sono legati ai codici)
  const map = new Map([[d.survey.id, uid('s')]]);
  (d.survey.plans || []).forEach(p => map.set(p.id, uid('pl'))); (d.photos || []).forEach(p => map.set(p.id, uid('ph'))); (d.vnotes || []).forEach(n => map.set(n.id, uid('n')));
  let js = JSON.stringify(d); for (const [a, b] of map) js = js.split('"' + a + '"').join('"' + b + '"');
  for (const [a, b] of map) for (const k of ['plan_', 'photo_', 'audio_']) oldIds[k + b] = k + a;
  return JSON.parse(js);
}
async function surveyAssets(sid) { // file già caricati online della versione che sto aggiornando
  const m = new Map(); const root = base() + '/' + sid; const docs = [];
  for (const d of await IDB.all('docs')) if (d.data && (d.path === root || d.path.startsWith(root + '/'))) docs.push(d.data);
  if (CAP.db) { try { const md = await withTimeout(CAP.db.doc(root).get(), 12000); if (md.exists) docs.push(md.data()); for (const col of ['plans', 'photos']) { const sn = await withTimeout(CAP.db.doc(root).collection(col).get(), 15000); sn.docs.forEach(x => docs.push(x.data())); } } catch (e) { } }
  for (const x of docs) {
    if (x.type === 'survey') (x.plans || []).forEach(p => p.asset && m.set('plan_' + p.id, p.asset));
    if (x.type === 'photo' && x.asset) m.set('photo_' + x.id, x.asset);
    if (x.type === 'plan') (x.vnotes || []).forEach(n => n.asset && m.set('audio_' + n.id, n.asset));
  }
  return m;
}
async function dropStaleDocs(d) { // aggiornamento: via i documenti di tavole e foto che nella nuova versione non ci sono più
  const root = base() + '/' + d.survey.id; const keep = new Set([root, ...(d.survey.plans || []).map(p => root + '/plans/' + p.id), ...(d.photos || []).map(p => root + '/photos/' + p.id), ...Object.keys(d.closure || {}).map(id => root + '/closure/' + id)]);
  for (const x of await IDB.all('docs')) if ((x.path === root || x.path.startsWith(root + '/')) && !keep.has(x.path)) { await IDB.del('docs', x.path); if (CAP.db) Sync.del(x.path); }
  if (CAP.db) { try { for (const col of ['plans', 'photos', 'closure']) { const sn = await withTimeout(CAP.db.doc(root).collection(col).get(), 15000); sn.docs.forEach(x => { const p = root + '/' + col + '/' + x.id; if (!keep.has(p)) Sync.del(p); }); } } catch (e) { } }
  const ids = new Set([...(d.survey.plans || []).map(p => p.id), ...(d.photos || []).map(p => p.id), ...(d.vnotes || []).map(n => n.id)]);
  for (const b of await IDB.all('blobs')) if (b.sid === d.survey.id && !ids.has(b.ref)) { await IDB.del('blobs', b.id); Uploads.q.delete(b.id); }
  [...Sync.last.keys()].forEach(k => { if (k === root || k.startsWith(root + '/')) Sync.last.delete(k); });
}
