# App iOS di prova (SopraLux, versione gratis): a ogni modifica dei sorgenti costruisce l'app su un Mac di GitHub
# e la carica su TestFlight. Servono tre secret del repository (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID (dalla pagina delle chiavi API di App Store Connect) e ASC_KEY_P8 (contenuto del file AuthKey_….p8).
# Finché mancano, la build iOS viene saltata.
name: App iOS di prova (TestFlight)
on:
  push:
    branches: [main]
    paths: ['sorgenti/src/**', 'sorgenti/build_app.sh', 'app/**', 'lib/**', '.github/workflows/app-ios.yml']
  workflow_dispatch:
concurrency:
  group: app-ios
  cancel-in-progress: true
jobs:
  testflight:
    runs-on: macos-latest
    env:
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: XP8C2J2LTM
    steps:
      - name: Chiave App Store Connect
        id: key
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$KEY_P8" ]; then
            echo "::warning::Mancano i secret ASC_KEY_ID, ASC_ISSUER_ID o ASC_KEY_P8: build iOS saltata"; echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            mkdir -p ~/private_keys && printf '%s\n' "$KEY_P8" > ~/private_keys/AuthKey_$KEY_ID.p8 && echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.key.outputs.ok == 'true'
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Dipendenze
        if: steps.key.outputs.ok == 'true'
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: App (pagina unica)
        if: steps.key.outputs.ok == 'true'
        run: TZ=Europe/Rome sh sorgenti/build_app.sh ../app/www
      - name: Capacitor
        if: steps.key.outputs.ok == 'true'
        working-directory: app
        run: npx cap sync ios
      - name: Archivio
        if: steps.key.outputs.ok == 'true'
        run: |
          xcodebuild -project app/ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=0.1 | tail -n 80
          # l'archivio si crea senza firma: la firma per l'App Store la fa l'esportazione, con il certificato gestito da Apple
          test -d "$RUNNER_TEMP/App.xcarchive"
      - name: Verifica della chiave (senza mostrarla)
        if: steps.key.outputs.ok == 'true'
        run: |
          f=~/private_keys/AuthKey_$KEY_ID.p8
          echo "righe: $(wc -l < "$f"), prima riga: $(head -1 "$f"), ultima: $(grep -v '^\s*$' "$f" | tail -1)"
          openssl pkey -in "$f" -noout && echo "chiave privata leggibile"
          ruby -ropenssl -rjson -rbase64 -rnet/http -e '
            key = OpenSSL::PKey::EC.new(File.read(File.expand_path("~/private_keys/AuthKey_#{ENV["KEY_ID"]}.p8")))
            b64 = ->(s){ Base64.urlsafe_encode64(s, padding: false) }
            h = b64.(JSON.dump({alg: "ES256", kid: ENV["KEY_ID"], typ: "JWT"}))
            now = Time.now.to_i
            p = b64.(JSON.dump({iss: ENV["ISSUER_ID"], iat: now, exp: now + 600, aud: "appstoreconnect-v1"}))
            der = key.sign(OpenSSL::Digest::SHA256.new, "#{h}.#{p}")
            asn = OpenSSL::ASN1.decode(der); r = asn.value[0].value.to_s(2).rjust(32, "\0"); s = asn.value[1].value.to_s(2).rjust(32, "\0")
            jwt = "#{h}.#{p}.#{b64.(r + s)}"
            uri = URI("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=it.diervsoft.sopralux")
            req = Net::HTTP::Get.new(uri); req["Authorization"] = "Bearer #{jwt}"
            res = Net::HTTP.start(uri.host, uri.port, use_ssl: true) { |http| http.request(req) }
            puts "API App Store Connect: HTTP #{res.code}"; puts res.body[0, 400]'
      - name: Invio a TestFlight
        if: steps.key.outputs.ok == 'true'
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" || {
            for d in $(find "${TMPDIR:-/tmp}" -maxdepth 2 -name '*.xcdistributionlogs' 2>/dev/null); do
              for f in "$d"/IDEDistribution.standard.log "$d"/IDEDistribution.critical.log; do [ -f "$f" ] && { echo "== $f"; grep -iv "authorization\|bearer" "$f" | tail -n 60; }; done
            done; exit 1; }
