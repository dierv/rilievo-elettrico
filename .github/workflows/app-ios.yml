# App iOS di prova (SopraLux, versione gratis): a ogni modifica dei sorgenti costruisce l'app su un Mac di GitHub
# e la carica su TestFlight. Servono tre secret del repository (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID (dalla pagina delle chiavi API di App Store Connect) e ASC_KEY_P8 (contenuto del file AuthKey_….p8).
# Finché mancano, la build iOS viene saltata.
name: App iOS di prova (TestFlight)
on:
  push:
    branches: [main]
    paths: ['sorgenti/src/**', 'sorgenti/build_app.sh', 'app/**', 'lib/**', '.github/workflows/app-ios.yml']
  workflow_dispatch:
concurrency:
  group: app-ios
  cancel-in-progress: true
jobs:
  testflight:
    runs-on: macos-latest
    env:
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: XP8C2J2LTM
    steps:
      - name: Chiave App Store Connect
        id: key
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$KEY_P8" ]; then
            echo "::warning::Mancano i secret ASC_KEY_ID, ASC_ISSUER_ID o ASC_KEY_P8: build iOS saltata"; echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            mkdir -p ~/private_keys && printf '%s\n' "$KEY_P8" > ~/private_keys/AuthKey_$KEY_ID.p8 && echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.key.outputs.ok == 'true'
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Dipendenze
        if: steps.key.outputs.ok == 'true'
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: App (pagina unica)
        if: steps.key.outputs.ok == 'true'
        run: TZ=Europe/Rome sh sorgenti/build_app.sh ../app/www
      - name: Capacitor
        if: steps.key.outputs.ok == 'true'
        working-directory: app
        run: npx cap sync ios
      - name: Certificato e profilo temporanei
        if: steps.key.outputs.ok == 'true'
        env:
          BUNDLE_ID: it.diervsoft.sopralux
        run: |
          ruby app/ios/ci_signing.rb create "$RUNNER_TEMP/sign"
          ruby app/ios/ci_signing.rb project "$RUNNER_TEMP/sign" app/ios/App/App.xcodeproj/project.pbxproj
      - name: Portachiavi con la firma
        if: steps.key.outputs.ok == 'true'
        run: |
          S="$RUNNER_TEMP/sign"; KC="$RUNNER_TEMP/ci.keychain-db"; KP=$(openssl rand -hex 16); PP=$(openssl rand -hex 8)
          echo "KC=$KC" >> "$GITHUB_ENV"
          security create-keychain -p "$KP" "$KC"; security set-keychain-settings -lut 7200 "$KC"; security unlock-keychain -p "$KP" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          curl -sSfL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$S/wwdr.cer" && security import "$S/wwdr.cer" -k "$KC" || true
          /usr/bin/openssl x509 -inform DER -in "$S/dist.cer" -out "$S/dist.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$S/dist.key" -in "$S/dist.pem" -out "$S/dist.p12" -passout pass:$PP
          security import "$S/dist.p12" -k "$KC" -P "$PP" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" > /dev/null
          security find-identity -v -p codesigning "$KC"
          U=$(cat "$S/profile_uuid")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do mkdir -p "$d"; cp "$S/profile.mobileprovision" "$d/$U.mobileprovision"; ls -la "$d"; done
          security cms -D -i "$S/profile.mobileprovision" > "$S/profile.plist"
          for k in Name UUID TeamIdentifier:0 Entitlements:application-identifier ExpirationDate; do echo "$k = $(/usr/libexec/PlistBuddy -c "Print :$k" "$S/profile.plist")"; done
      - name: Archivio firmato
        if: steps.key.outputs.ok == 'true'
        run: |
          set -o pipefail
          xcodebuild -project app/ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=0.1 OTHER_CODE_SIGN_FLAGS="--keychain $KC" \
            | grep -E "error|warning: .*sign|ARCHIVE|BUILD" | tail -n 60
      - name: File .ipa
        if: steps.key.outputs.ok == 'true'
        run: |
          N=$(cat "$RUNNER_TEMP/sign/profile_name")
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>it.diervsoft.sopralux</key><string>$(cat "$RUNNER_TEMP/sign/profile_uuid")</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"
      - name: Invio a TestFlight
        if: steps.key.outputs.ok == 'true'
        run: xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/export/App.ipa" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
      - name: Pulizia (certificato revocato, profilo cancellato)
        if: always() && steps.key.outputs.ok == 'true'
        run: |
          ruby app/ios/ci_signing.rb cleanup "$RUNNER_TEMP/sign" || true
          [ -n "${KC:-}" ] && security delete-keychain "$KC" || true
