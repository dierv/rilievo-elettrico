<div id="home">
  <div class="row wrap hhead">
    <div class="brand">
      <svg class="blogo" viewBox="0 0 1024 1024" aria-hidden="true"><defs><linearGradient id="slg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2d62f3"/><stop offset="1" stop-color="#1739ad"/></linearGradient></defs><rect width="1024" height="1024" rx="230" fill="url(#slg)"/><g fill="none" stroke="#fff" stroke-width="64" stroke-linejoin="round" stroke-linecap="round"><path d="M262 412V262H412"/><path d="M612 262H762V412"/><path d="M762 612V762H612"/><path d="M412 762H262V612"/></g><path d="M558 305L410 546H509L464 719L621 473H521L587 305Z" fill="#fbbf24"/></svg>
      <div><h1>Sopra<span>Lux</span></h1><div class="mut bsub">Rilievi elettrici: dalla pianta al computo</div></div>
    </div>
    <div style="flex:none" class="row">
      <button id="hLib">Simboli</button>
      <button id="hSet">Impostazioni</button>
      <button id="hNew" class="pri">+ Nuovo sopralluogo</button>
    </div>
  </div>
  <div id="hBanner"></div>
  <div id="hList" class="hgrid"></div>
</div>

<div id="sv" class="hide">
  <div id="topbar">
    <button id="bBack" class="ghost" title="Sopralluoghi">&#8592;</button>
    <div class="ttl" id="svTitle"></div>
    <select id="planSel"></select>
    <button id="bAddPlan" class="sm">+ Tavola</button>
    <div class="sp"></div>
    <span id="syncB" class="stat"></span>
    <button id="bUndo" class="sm" title="Annulla">&#8630; Annulla</button>
    <button id="bComputo" class="sm pri">Computo / Esporta</button>
    <button id="bMenu" class="sm" title="Menu">&#8942;</button>
    <div class="tbbr"></div>
  </div>
  <div id="main">
    <div id="tools"></div>
    <div id="cwrap">
      <canvas id="cv"></canvas>
      <div id="hint" class="hide"></div>
      <div id="aiQ"></div>
      <div id="zoomBtns">
        <button id="zCol" class="hide" title="Colori del DXF"><svg viewBox="0 0 34 24" width="34" height="24"><defs><linearGradient id="zColG" x1="0" x2="1"><stop offset="0" stop-color="#dc2626"/><stop offset=".5" stop-color="#16a34a"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs><rect class="trk" x="2" y="3" width="30" height="16" rx="8"/><circle class="knb" cx="10" cy="11" r="6"/></svg><span>colori</span></button>
        <button id="zRot" title="Ruota la pianta / segui bussola"><svg id="zRotIco" viewBox="0 0 24 24" width="26" height="26"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3.5l3.2 8.5H8.8z" fill="#dc2626"/><path d="M12 20.5L8.8 12h6.4z" fill="#94a3b8"/></svg></button>
        <button id="zIn">+</button><button id="zOut">&minus;</button><button id="zFit" style="font-size:13px">Tutto</button>
      </div>
      <div id="rotPanel" class="hide"></div>
      <div id="palette" class="hide"></div>
    </div>
    <div id="pwrap"><button id="pnTog" type="button" aria-expanded="true"><span class="pnh"></span><span class="pnc"></span></button><div id="panel"></div></div>
  </div>
</div>

<div id="modal" class="hide"><div class="box"></div></div>
<div id="viewer" class="hide">
  <div class="vt">
    <button id="vClose">&#10005; Chiudi</button>
    <button id="vPrev">&#8249;</button><button id="vNext">&#8250;</button>
    <span id="vTitle" style="flex:1;font-size:14px"></span>
    <button id="vBoxes">Riquadri</button>
  </div>
  <div id="vstage"><div id="vinner"><img id="vimg" alt=""><svg id="vsvg" viewBox="0 0 1 1" preserveAspectRatio="none"></svg></div></div>
  <div id="vside"></div>
</div>
<div id="toast" class="hide"></div>
<input type="file" id="fPlan" accept=".pdf,.dxf,.dwg,image/*" class="hide">
<input type="file" id="fPlanCam" accept="image/*" capture="environment" class="hide">
<input type="file" id="fCam" accept="image/*" capture="environment" class="hide">
<input type="file" id="fGal" accept="image/*" multiple class="hide">
<input type="file" id="fAudRec" accept="audio/*" capture class="hide">
<input type="file" id="fAudPick" accept="audio/*,.m4a,.mp3,.aac,.amr,.3gp,.3gpp,.ogg,.opus,.wav,.webm,.flac" class="hide">

<input type="file" id="fSymImg" accept="image/png,image/svg+xml,image/jpeg" class="hide">
